<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пульт собеседований</title>
<script src="telegram-web-app.js"></script>
<script>window.onerror=function(m){var e=document.getElementById("err");if(e){e.hidden=false;e.textContent="Ошибка: "+m}};</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Канон СВ-Транс: бумага, чернила, тонкая линия, красный акцент. Крупно и спокойно. */
:root{
  --paper:#fafafa; --card:#fff; --ink:#0a0a0a; --muted:#6b6b6b; --faint:#9b9b9b;
  --line:#e2e2e2; --red:#d92b2b; --red-soft:#fdeeee;
  --green:#1f8f4e; --green-soft:#eaf6ef; --amber:#b86e00; --amber-soft:#fdf4e6;
  --r:18px; --top:env(safe-area-inset-top);
}
:root[data-theme="dark"]{
  --paper:#0f0f10; --card:#1a1a1c; --ink:#f4f4f5; --muted:#a0a0a6; --faint:#6e6e74;
  --line:#2b2b2f; --red:#ff5a5a; --red-soft:#2a1717;
  --green:#3ccf7e; --green-soft:#132519; --amber:#ffb340; --amber-soft:#2a2112;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper)}
body{color:var(--ink);font:17px/1.45 "IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

header{padding:calc(22px + var(--top)) 2px 18px}
.kick{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 0;font-size:38px;line-height:1.05;font-weight:700;letter-spacing:-.025em}
h1 .n{color:var(--red)}
.sub{margin-top:8px;font-size:16px;color:var(--muted)}

/* вкладки */
.tabs{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 14px;margin:0 -2px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--line);padding:4px;border-radius:14px}
.seg button{border:0;background:transparent;padding:11px 2px;border-radius:11px;
  font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;position:relative;white-space:nowrap;letter-spacing:-.01em}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.badge{display:inline-block;min-width:17px;height:17px;padding:0 4px;margin-left:3px;border-radius:9px;
  background:var(--red);color:#fff;font-size:11px;line-height:17px;vertical-align:1px}

/* день в недельном виде */
.day{margin:22px 2px 10px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.day:first-child{margin-top:4px}

/* карточка */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;
  transition:border-color .15s}
.card.next{border-color:var(--ink)}
.row{display:flex;align-items:center;gap:14px;padding:16px 16px 16px 18px;cursor:pointer;user-select:none}
.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;letter-spacing:-.02em;min-width:62px}
.who{flex:1;min-width:0}
.nm{font-weight:600;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.mt{font-size:14px;color:var(--muted);margin-top:3px;white-space:nowrap}
.tag{flex:0 0 auto;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap}
.tag.next{background:var(--ink);color:var(--paper)}
.tag.wait{background:var(--red-soft);color:var(--red)}
.tag.g{background:var(--green-soft);color:var(--green)}
.tag.r{background:var(--red-soft);color:var(--red)}
.tag.a{background:var(--amber-soft);color:var(--amber)}
.tag.x{background:var(--line);color:var(--muted)}

.acts{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s cubic-bezier(.2,.8,.3,1)}
.card.open .acts{grid-template-rows:1fr}
.acts>div{overflow:hidden}
.acts .in{display:grid;gap:8px;padding:2px 12px 14px}
.q{font-size:14px;color:var(--muted);padding:4px 6px 2px}
.act{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--paper);
  border-radius:14px;padding:17px 16px;font-weight:600;font-size:17px;text-align:left;cursor:pointer;
  transition:transform .08s}
.act:active{transform:scale(.985)}
.act i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.act.g i{background:var(--green-soft);color:var(--green)}
.act.r i{background:var(--red-soft);color:var(--red)}
.act.a i{background:var(--amber-soft);color:var(--amber)}
.undo{border:0;background:none;color:var(--muted);font-size:14px;padding:4px 6px 0;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;justify-self:start}

/* состояния */
.empty{text-align:center;padding:64px 24px 40px}
.empty b{display:block;font-size:24px;letter-spacing:-.02em;margin-bottom:8px}
.empty span{color:var(--muted);font-size:15px}
.sk{height:78px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin-bottom:10px;
  animation:p 1.3s ease-in-out infinite}
@keyframes p{50%{opacity:.5}}

footer{text-align:center;color:var(--faint);font-size:13px;padding:26px 12px 0;line-height:1.7}
footer b{color:var(--ink);font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,160%);
  background:var(--ink);color:var(--paper);padding:13px 20px;border-radius:14px;font-weight:600;font-size:15px;
  transition:transform .26s cubic-bezier(.2,.9,.3,1),visibility .26s;z-index:50;max-width:88vw;text-align:center;visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible}
.savebar{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));border:0;border-radius:14px;
  background:var(--red);color:#fff;font-weight:600;font-size:17px;padding:17px;z-index:40}
.savebar[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kick" id="kick">&nbsp;</div>
    <h1 id="title">Загружаю…</h1>
    <div class="sub" id="sub">&nbsp;</div>
  </header>

  <div class="tabs"><div class="seg" id="seg">
    <button data-v="today" class="on">Сегодня</button>
    <button data-v="tomorrow">Завтра</button>
    <button data-v="week">Неделя</button>
    <button data-v="wait">Отметить<span class="badge" id="badge" hidden></span></button>
  </div></div>

  <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>

  <footer><b id="addr">Тверь, Симеоновская улица, 72</b><br><span id="stamp"></span></footer>
</div>
<div class="toast" id="toast"></div>
<div id="err" hidden style="position:fixed;top:8px;left:8px;right:8px;background:#fdeeee;color:#d92b2b;padding:10px;border-radius:10px;font-size:13px;z-index:99"></div>
<button class="savebar" id="savebar" hidden></button>

<script>
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.platform !== 'unknown' ? Telegram.WebApp : null;
const DEMO = /[?&]demo/.test(location.search);
/* Отметки уходят в бот через sendData — это работает, только если пульт открыт кнопкой под строкой ввода. */
const P = new URLSearchParams(location.search);
const BOT = P.get('b') || '';
/* v8, 24.09: канал ntfy убран — компьютер с ботом его не видит, отметки терялись молча.
   Из кнопки «📋 Пульт» под строкой ввода — sendData; из любого другого входа — ссылка /start с кодами
   отметок прямо в чат бота. Оба пути идут только через Telegram. */
const VIA_KEYBOARD = !!(tg && tg.initData && !(tg.initDataUnsafe && tg.initDataUnsafe.query_id));
const CAN_SEND = !!(tg && (VIA_KEYBOARD || BOT));
const marks = new Map();   // id -> итог, ещё не отправленные
const $ = id => document.getElementById(id);

/* тема — как в Telegram */
function pTheme(){
  const dark = false;   // канон СВ-Транс — всегда светлый, одинаково на телефоне и компьютере
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  if (tg) { const bg = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor && tg.setBottomBarColor(bg); } catch(e){} }
}
if (tg) { tg.ready(); tg.expand(); tg.onEvent('themeChanged', pTheme); }
pTheme();

const WD  = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WDv = ['воскресенье','понедельник','вторник','среду','четверг','пятницу','субботу'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const RES = {
  'пришёл_берём':      {k:'g', ic:'✓', t:'Берём',       say:'Спрошу, когда сможет выйти'},
  'пришёл_не_подошёл': {k:'r', ic:'✕', t:'Не подошёл',  say:'Отправлю вежливый отказ'},
  'не_пришёл':         {k:'a', ic:'—', t:'Не пришёл',   say:'Предложу другой день'}
};
const CLOSED = {'перенесено':'Перенесено','отказ':'Отказался'};

let view = 'today', data = [], now = new Date(), openId = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const pDay = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const hm = d => String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function pWord(n, f){ const a=n%10,b=n%100; return a===1&&b!==11?f[0]:(a>=2&&a<=4&&(b<12||b>14))?f[1]:f[2]; }
const MEET = ['встреча','встречи','встреч'];

function pHap(t){ try{ const h = tg.HapticFeedback;
  t==='ok' ? h.notificationOccurred('success') : t==='err' ? h.notificationOccurred('error') : h.selectionChanged(); }catch(e){} }
function pToast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._); t._=setTimeout(()=>t.classList.remove('on'),2600); }

const TODAY = () => iso(now);
const closed = m => !!(m.результат || CLOSED[m.статус]);
const isPast = m => m.дата < TODAY() || (m.дата === TODAY() && m.время <= hm(now));
const waiting = () => data.filter(m => !closed(m) && isPast(m));

/* ── данные: приходят внутри ссылки кнопки (#d=...) ── */
function pUnpack(){
  const q = P.get('d');
  const m = q ? [0, q] : location.hash.match(/[#&]d=([A-Za-z0-9_-]+)/);
  if (!m) return null;
  let b = m[1].replace(/-/g,'+').replace(/_/g,'/'); while (b.length % 4) b += '=';
  const bytes = Uint8Array.from(atob(b), c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function pLoad(){
  if (DEMO) { pDemo(); return pDraw(); }
  let j = null;
  try { j = pUnpack(); } catch(e) {}
  if (!j) return pFail('Откройте пульт из бота', 'Кнопка «📋 Пульт» — под строкой ввода в чате с ботом.');
  data = j.m.map(r => ({id:r[0], дата:r[1], время:r[2], имя:r[3], роль:r[4], аккаунт:r[5], результат:r[6], статус:r[7]||'ожидается', c:r[8]||''}));
  /* «сейчас» — по часам телефона, а не по времени списка: кнопка под строкой ввода обновляется
     только с новым сообщением бота, и вечером пульт показывал утро (прошедшие встречи — как будущие) */
  now = new Date();
  const q = String(j.t).match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);
  $('stamp').textContent = (q ? 'список от ' + q[4] + ':' + q[5] : 'список') + (CAN_SEND ? '' : ' · только просмотр');
  pDraw();
}
function pFail(t, s){
  $('kick').innerHTML='&nbsp;'; $('title').textContent=t; $('sub').textContent=s; $('list').innerHTML='';
}

/* ── отрисовка ── */
function pPick(){
  const t = TODAY(), tm = iso(addD(now,1)), w = iso(addD(now,7));
  if (view==='today')    return data.filter(m => m.дата===t);
  if (view==='tomorrow') return data.filter(m => m.дата===tm);
  if (view==='week')     return data.filter(m => m.дата>=t && m.дата<w);
  return waiting();
}

function pHead(items){
  const n = items.length, open = items.filter(m=>!closed(m)).length;
  let k, h, s;
  if (view==='wait'){
    k = 'Прошли — отметьте, как было';
    h = n ? `<span class="n">${n}</span> ${pWord(n,MEET)}` : 'Всё отмечено';
    s = n ? 'Отметьте и нажмите «Сохранить» внизу — людям я напишу сам' : 'Спасибо! Писать людям не нужно.';
  } else if (view==='week'){
    k = 'Ближайшие 7 дней';
    h = n ? `<span class="n">${n}</span> ${pWord(n,MEET)}` : 'Встреч нет';
    const days = new Set(items.map(m=>m.дата)).size;
    s = n ? `в ${days} ${pWord(days,['день','дня','дней'])}` : 'Новые появятся, как только люди запишутся';
  } else {
    const d = view==='today' ? now : addD(now,1);
    k = (view==='today'?'Сегодня':'Завтра') + ', ' + WD[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()];
    h = n ? `<span class="n">${n}</span> ${pWord(n,MEET)}` : 'Свободный день';
    if (!n) s = 'Встреч не назначено';
    else if (view==='tomorrow') s = 'Первый — ' + items[0].имя + ' в ' + items[0].время;
    else { const nx = items.find(m => !closed(m) && !isPast(m));
      s = nx ? 'Следующий — ' + nx.имя + ' в ' + nx.время : open ? 'Не отмечено: ' + open : 'Все отмечены — спасибо'; }
  }
  $('kick').textContent = k; $('title').innerHTML = h; $('sub').textContent = s;
}

function pCard(m, nextId){
  const r = m.результат && RES[m.результат];
  const acc = m.аккаунт && m.аккаунт !== 'ТК' ? ' · ' + esc(m.аккаунт).replace(/-/g,'\u2011') : '';
  const dd = view==='wait' && m.дата !== TODAY() ? ' · ' + pDay(m.дата).getDate() + ' ' + MON[pDay(m.дата).getMonth()] : '';
  let tag = '';
  if (r) tag = `<span class="tag ${r.k}">${r.ic} ${r.t}</span>`;
  else if (CLOSED[m.статус]) tag = `<span class="tag x">${CLOSED[m.статус]}</span>`;
  else if (m.id === nextId) tag = '<span class="tag next">Следующий</span>';
  else if (isPast(m)) tag = '<span class="tag wait">Отметить</span>';
  const canAct = !CLOSED[m.статус];
  const body = !canAct ? '' : r
    ? `<div class="in"><button class="undo" data-u="${esc(m.id)}">Изменить отметку</button></div>`
    : `<div class="in"><div class="q">Как прошла встреча?</div>
        <button class="act g" data-r="пришёл_берём"><i>✓</i>Пришёл, берём</button>
        <button class="act r" data-r="пришёл_не_подошёл"><i>✕</i>Пришёл, не подошёл</button>
        <button class="act a" data-r="не_пришёл"><i>—</i>Не пришёл</button></div>`;
  return `<div class="card ${m.id===nextId?'next':''} ${openId===m.id?'open':''}" data-id="${esc(m.id)}">
    <div class="row"><div class="tm">${esc(m.время)}</div>
      <div class="who"><div class="nm">${esc(m.имя)}</div><div class="mt">${esc(m.роль||'')}${acc}${dd}</div></div>${tag}</div>
    <div class="acts"><div>${body}</div></div></div>`;
}

function pDraw(){
  const items = pPick().sort((a,b) => (a.дата+a.время).localeCompare(b.дата+b.время));
  pHead(items);
  const w = waiting().length, b = $('badge'); b.hidden = !w; b.textContent = w;
  const nx = data.filter(m => m.дата===TODAY() && !closed(m) && !isPast(m)).sort((a,b)=>a.время.localeCompare(b.время))[0];
  const nextId = nx && nx.id;
  const L = $('list');
  if (!items.length){
    L.innerHTML = `<div class="empty"><b>${view==='wait'?'Готово':'Пусто'}</b><span>${view==='wait'?'Все прошедшие встречи отмечены.':'На эти дни встреч нет.'}</span></div>`;
  } else if (view==='week'){
    let out = '', last = '';
    for (const m of items){
      if (m.дата !== last){ last = m.дата; const d = pDay(m.дата);
        const lbl = m.дата===TODAY() ? 'Сегодня' : m.дата===iso(addD(now,1)) ? 'Завтра' : WD[d.getDay()];
        out += `<div class="day">${lbl}, ${d.getDate()} ${MON[d.getMonth()]}</div>`; }
      out += pCard(m, nextId);
    }
    L.innerHTML = out;
  } else L.innerHTML = items.map(m => pCard(m, nextId)).join('');
  pMainBtn();
}

/* нижняя кнопка Telegram: «Сохранить отметки» */
let mbBound = false;
function pMainBtn(){
  const n = marks.size;
  if (!tg || !tg.MainButton) { $('savebar').hidden = !n; $('savebar').textContent = 'Сохранить отметки: ' + n; return; }
  if (!mbBound){ tg.MainButton.onClick(pSend); mbBound = true; }
  if (n) tg.MainButton.setParams({text:'Сохранить отметки: '+n, is_visible:true, color:'#d92b2b', text_color:'#ffffff'});
  else tg.MainButton.hide();
}
let sending = false;
async function pSend(){
  if (!marks.size || sending) return;
  if (!CAN_SEND){ pHap('err'); pToast('Откройте пульт из бота — кнопка «📋 Пульт» внизу'); return; }
  const payload = JSON.stringify({marks:[...marks.entries()]});
  if (VIA_KEYBOARD){ pHap('ok'); tg.sendData(payload); return; }
  sending = true;
  let ok = false;
  /* не из клавиатуры: ссылка /start с кодами отметок прямо в чат бота (до 10 отметок за раз) */
  const L = {'пришёл_берём':'b','пришёл_не_подошёл':'n','не_пришёл':'x'};
  const sp = 'm' + [...marks.entries()].slice(0,10).map(([id,res]) => {
    const m = data.find(x => x.id===id); return (m && m.c ? m.c : '') + (L[res] || 'u'); }).filter(s => s.length===6).join('');
  try { tg.openTelegramLink('https://t.me/' + BOT + '?start=' + sp); ok = sp.length > 1; } catch(e){}
  if (ok){
    for (const id of marks.keys()){ const m = data.find(x => x.id===id); if (m) m.orig = m.результат; }
    marks.clear(); pDraw(); pHap('ok'); pToast('Сохранено. Бот подтвердит в чате');
  } else { pHap('err'); pToast('Не сохранилось — нет связи. Попробуйте ещё раз'); }
  sending = false; pMainBtn();
}

function pSetView(v){
  view = v; openId = null;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.v===v));
  pHap(); pDraw(); scrollTo({top:0, behavior:'smooth'});
}
$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) pSetView(b.dataset.v); });

$('list').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c) return;
  const id = c.dataset.id, act = e.target.closest('[data-r]'), undo = e.target.closest('[data-u]');
  if (act) return pSave(id, act.dataset.r);
  if (undo) return pSave(id, null);
  if (e.target.closest('.row')){
    openId = openId===id ? null : id; pHap();
    document.querySelectorAll('.card').forEach(x => x.classList.toggle('open', x.dataset.id===openId));
  }
});

function pSave(id, result){
  const m = data.find(x => x.id===id); if (!m) return;
  if (!('orig' in m)) m.orig = m.результат;
  m.результат = result; m.статус = result || 'ожидается'; openId = result ? null : id;
  if (result === m.orig) marks.delete(id); else marks.set(id, result);
  pDraw();
  if (result){ pHap('ok'); pToast(marks.size ? 'Отмечено. Нажмите «Сохранить» внизу' : RES[result].say); } else pHap();
}
